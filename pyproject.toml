[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semester-data-processor"
version = "0.1.0"
description = "Semester course data processing tool for roster merging, gradebook consolidation, dataset output README generation, and accreditation assessment reporting."
readme = "README.md"
authors = [
    { name = "UWF CS Department", email = "xfang@uwf.edu" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "tabulate>=0.9.0",
]

[project.scripts]
semester-processor = "semester_data_processor.cli:main"
sdp = "semester_data_processor.cli:main"
assessment-processor = "semester_data_processor.cli:main"
adp = "semester_data_processor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/semester_data_processor"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
