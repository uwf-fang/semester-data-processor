[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assessment-data-processor"
version = "0.1.0"
description = "Course assessment data processing tool for roster merging, gradebook processing, and ABET/SACSCOC assessment reporting."
readme = "README.md"
authors = [
    { name = "UWF CS Department", email = "xfang@uwf.edu" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "tabulate>=0.9.0",
]

[project.scripts]
assessment-processor = "assessment_data_processor.cli:main"
adp = "assessment_data_processor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/assessment_data_processor"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
